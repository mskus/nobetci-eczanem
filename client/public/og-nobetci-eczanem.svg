<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Medical Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Main Card -->
  <rect x="70" y="65" width="1060" height="500" rx="36" fill="url(#card)" filter="url(#shadow)"/>

  <!-- Medical Cross Badge -->
  <rect x="130" y="130" width="110" height="110" rx="26" fill="#dc2626"/>
  <path d="M173 155 H197 V173 H215 V197 H197 V215 H173 V197 H155 V173 H173 Z" fill="#ffffff"/>

  <!-- Live Status Pill -->
  <rect x="265" y="142" width="310" height="42" rx="21" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <circle cx="292" cy="163" r="8" fill="#16a34a"/>
  <text x="312" y="169" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#166534">81 İL · 973 İLÇE CANLI NÖBET</text>

  <!-- Title & Subtitle -->
  <text x="130" y="310" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="900" fill="#111827">Nöbetçi Eczanem</text>
  <text x="130" y="370" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#dc2626">En Yakın Nöbetçi Eczane, 7/24 Acil Hastane &amp; ASM Rehberi</text>
  <text x="130" y="425" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#4b5563">Canlı Harita · Tek Tıkla Yol Tarifi · SGK Katkı Payı · TİTCK İlaç Sorgulama</text>

  <!-- Bottom Feature Badges -->
  <g transform="translate(130, 462)">
    <rect x="0" y="0" width="230" height="52" rx="14" fill="#fee2e2"/>
    <text x="115" y="33" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#991b1b">📍 GPS Mesafe Sıralı</text>

    <rect x="250" y="0" width="240" height="52" rx="14" fill="#fef3c7"/>
    <text x="370" y="33" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#92400e">🏥 7/24 Acil Hastane</text>

    <rect x="510" y="0" width="250" height="52" rx="14" fill="#e0f2fe"/>
    <text x="635" y="33" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#075985">💊 İlaç Fiyat &amp; Barkod</text>
  </g>
</svg>
